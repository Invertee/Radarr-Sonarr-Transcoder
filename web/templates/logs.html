<!DOCTYPE html>
<html>
<head>
    <title>Live Logs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #121212; color: #00ff41; font-family: 'Courier New', monospace; }
        #logContainer { 
            height: 90vh; 
            overflow-y: auto; 
            background: #000; 
            padding: 15px; 
            border-radius: 5px; 
            border: 1px solid #333;
        }
        #logOutput { 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body class="p-4">
    <div class="d-flex justify-content-between mb-2">
        <h5 class="text-uppercase">Transcode Output</h5>
        <span class="badge bg-success">Live Stream</span>
    </div>
    <div id="logContainer">
        <pre id="logOutput"></pre>
    </div>

    <script>
        const eventSource = new EventSource("/stream-logs");
        const container = document.getElementById("logContainer");
        const output = document.getElementById("logOutput");

        eventSource.onmessage = function(e) {
            // Append the message and a newline
            output.innerText += e.data + "\n";
            // Auto-scroll to the bottom
            container.scrollTop = container.scrollHeight;
            
            // Limit memory usage by trimming old logs
            if (output.innerText.length > 100000) {
                output.innerText = output.innerText.slice(-50000);
            }
        };

        eventSource.onerror = function() {
            output.innerText += "\n[Connection lost. Reconnecting...]\n";
        };
    </script>
</body>
</html>
